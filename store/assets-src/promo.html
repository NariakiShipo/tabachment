<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tabachment promo tile</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        position: relative;
        display: flex;
        align-items: center;
        background: radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.16), transparent 42%),
          linear-gradient(135deg, var(--indigo-400), var(--indigo-700) 70%, #3730a3);
        color: #fff;
      }

      .brand {
        display: flex;
        align-items: center;
      }

      .brand svg {
        flex: none;
        filter: drop-shadow(0 10px 24px rgba(30, 27, 75, 0.35));
      }

      .name {
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .tagline {
        font-weight: 600;
        opacity: 0.95;
      }

      .sub {
        font-weight: 500;
        opacity: 0.8;
      }

      /* 440 x 280 */
      .small {
        padding: 0 34px;
      }

      .small .brand {
        gap: 18px;
      }

      .small .name {
        font-size: 36px;
      }

      .small .tagline {
        margin-top: 6px;
        font-size: 17px;
        line-height: 1.35;
      }

      .small .sub {
        margin-top: 10px;
        font-size: 13px;
      }

      /* 1400 x 560 */
      .marquee {
        gap: 56px;
        padding: 0 96px;
      }

      .marquee .copy {
        flex: 1;
      }

      .marquee .brand {
        gap: 28px;
      }

      .marquee .name {
        font-size: 76px;
      }

      .marquee .tagline {
        margin-top: 10px;
        font-size: 28px;
        white-space: nowrap;
      }

      .marquee .sub {
        margin-top: 18px;
        font-size: 22px;
      }

      .scene {
        position: relative;
        flex: none;
        width: 520px;
        height: 400px;
      }

      .card {
        position: absolute;
        top: 170px;
        left: 0;
        width: 200px;
        height: 140px;
        border-radius: 12px;
        background: var(--paper);
        box-shadow: 0 18px 40px rgba(30, 27, 75, 0.35);
        color: var(--ink);
      }

      .card .pill {
        position: absolute;
        top: 10px;
        left: 10px;
      }

      .card .meta {
        position: absolute;
        right: 14px;
        bottom: 14px;
        left: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 600;
      }

      .arrow {
        position: absolute;
        top: 50px;
        left: 110px;
      }

      .tab-window {
        position: absolute;
        top: 40px;
        right: 0;
        width: 280px;
        height: 320px;
      }

      .tabs {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 38px;
        padding: 0 10px;
        background: #dfe1ea;
      }

      .tab {
        width: 110px;
        height: 28px;
        padding: 0 10px;
        border-radius: 8px 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 28px;
        white-space: nowrap;
        overflow: hidden;
      }

      .tab.active {
        background: #fff;
        color: var(--ink);
        font-weight: 600;
      }

      .viewer {
        height: 282px;
        padding: 18px 34px;
        background: #3c3f46;
      }

      .page {
        display: grid;
        gap: 9px;
        height: 100%;
        padding: 18px;
        border-radius: 3px;
        background: #fff;
        align-content: start;
      }
    </style>
  </head>
  <body>
    <script src="strings.js"></script>
    <script>
      const size = params.get('size') === 'marquee' ? 'marquee' : 'small';
      const iconSize = size === 'marquee' ? 124 : 96;
      const icon = `
        <svg width="${iconSize}" height="${iconSize}" viewBox="14 6 68 84" aria-hidden="true">
          <path d="M30 16h26l18 18v42a6 6 0 0 1-6 6H30a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6z" fill="#fff"/>
          <path d="M56 16v12a6 6 0 0 0 6 6h12z" fill="#c9c8ff"/>
          <path d="M38 68 61 45M46 44h16v16" fill="none" stroke="#4f46e5" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M31 34V16a6.5 6.5 0 0 1 13 0v19a4.25 4.25 0 0 1-8.5 0V20" fill="none" stroke="#1e1b4b" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round" transform="rotate(-22 37.5 24)"/>
        </svg>`;
      const newTabIcon =
        '<svg width="14" height="14" viewBox="0 0 24 24" stroke-width="2.4"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
      document.body.className = size;
      document.body.innerHTML = `
        <div class="copy">
          <div class="brand">${icon}<div><div class="name">Tabachment</div><div class="tagline" data-t="tagline"></div></div></div>
          <div class="sub" data-t="promoSub"></div>
        </div>
        ${
          size === 'marquee'
            ? `<div class="scene" aria-hidden="true">
                <div class="card">
                  <span class="pill">${newTabIcon}<span data-t="newTab"></span></span>
                  <div class="meta"><span class="badge" style="background:var(--pdf)">PDF</span><span>report.pdf</span></div>
                </div>
                <svg class="arrow stroke-icon" width="130" height="130" viewBox="0 0 130 130" stroke="#fff" stroke-width="6">
                  <path d="M30 112 C 34 60, 70 40, 116 40" /><path d="M102 26 L118 40 L102 54" />
                </svg>
                <div class="window tab-window">
                  <div class="tabs"><div class="tab">Inbox</div><div class="tab active">report.pdf</div></div>
                  <div class="viewer"><div class="page">
                    <div class="bar" style="width:70%;height:14px;background:#c7c9ff"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar" style="width:85%"></div>
                    <div class="bar" style="width:60%"></div><div class="bar"></div><div class="bar" style="width:75%"></div>
                  </div></div>
                </div>
              </div>`
            : ''
        }`;
      if (size === 'small') document.querySelector('.sub').style.marginLeft = `${iconSize + 18}px`;
      else document.querySelector('.sub').style.marginLeft = `${iconSize + 28}px`;
      fillStrings();
    </script>
  </body>
</html>
