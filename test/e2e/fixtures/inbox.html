<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inbox - Fake Gmail</title>
    <style>
      body { font: 14px Arial, sans-serif; margin: 24px; }
      .aQH { display: flex; flex-wrap: wrap; gap: 12px; }
      /* Gmail's attachment cards are positioned, fixed-size tiles. */
      span.aZo { position: relative; display: inline-block; width: 180px; height: 120px; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
      span.aZo > a { display: block; height: 100%; color: inherit; text-decoration: none; }
      .aSH { padding: 70px 8px 0; }
      .aQw { position: absolute; right: 6px; bottom: 6px; }
      .aQv { display: inline-block; padding: 2px 6px; border: 1px solid #999; border-radius: 4px; background: #fff; cursor: pointer; }
      .dL { display: inline-flex; gap: 8px; margin-top: 24px; padding: 4px 8px; background: #f1f3f4; }
    </style>
  </head>
  <body>
    <div class="hq gt">
      <div class="aQH" id="attachments"></div>
    </div>

    <div class="compose">
      <div class="dL" id="compose-chip">
        <a class="dO" target="_blank"
          href="https://mail.google.com/mail/u/0/?ui=2&amp;ik=abc123&amp;view=att&amp;th=draft1&amp;attid=0.1&amp;disp=safe&amp;realattid=f_draft&amp;zw">
          <div class="vI">draft-notes.txt</div>
          <div class="vJ">(1 K)</div>
        </a>
        <div class="vq" role="button" aria-label="Remove attachment">×</div>
      </div>
    </div>

    <script>
      // Attachment cards in the structure Gmail uses (span.aZo with a
      // download_url attribute, a preview link and a row of buttons).
      const ATTACHMENTS = [
        ['card-pdf', 'f_pdf', 'application/pdf', 'report 報告.pdf'],
        ['card-octet', 'f_octet', 'application/octet-stream', 'scan.pdf'],
        ['card-png', 'f_png', 'image/png', 'photo.png'],
        ['card-csv', 'f_csv', 'text/csv', 'data.csv'],
        ['card-csv-sandbox', 'f_csv_sandbox', 'text/csv', 'sandboxed.csv'],
        ['card-big5', 'f_big5', 'text/plain', 'big5.txt'],
        ['card-json', 'f_json', 'application/json', 'config.json'],
        ['card-docx', 'f_docx', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'memo.docx'],
        ['card-evil', 'f_evil', 'text/html', 'invoice.pdf'],
      ];

      function attachmentUrl(realattid, index, disp) {
        return (
          `https://mail.google.com/mail/u/0?ui=2&ik=abc123&attid=0.${index + 1}&permmsgid=msg-f:1712345678901234567` +
          `&th=18f0c0ffee&view=att&disp=${disp}&realattid=${realattid}` + (disp === 'inline' ? '&safe=1&zw' : '&zw')
        );
      }

      function addCard(id, realattid, mime, name, index = document.querySelectorAll('span.aZo').length) {
        const card = document.createElement('span');
        card.className = 'aZo N5jrZb';
        card.id = id;
        card.draggable = true;
        card.setAttribute('download_url', `${mime}:${name}:${attachmentUrl(realattid, index, 'safe')}`);

        const link = document.createElement('a');
        link.className = 'aQy e';
        link.target = '_blank';
        link.setAttribute('role', 'link');
        link.href = attachmentUrl(realattid, index, 'inline');
        const body = document.createElement('div');
        body.setAttribute('aria-hidden', 'true');
        body.innerHTML = '<div class="aSH"><div class="aYy"><div class="aYz"><div class="a12"><div class="aQA"><span class="aV3"></span></div><div class="aYp"><span class="SaH2Ve">1 KB</span></div></div></div></div></div>';
        body.querySelector('.aV3').textContent = name;
        link.append(body);

        const buttons = document.createElement('div');
        buttons.className = 'aQw';
        buttons.innerHTML = '<div role="button" class="aQv" data-action="download" aria-label="Download">Download</div>';

        card.append(link, buttons);
        document.getElementById('attachments').append(card);
        return card;
      }

      ATTACHMENTS.forEach(([id, realattid, mime, name], index) => addCard(id, realattid, mime, name, index));

      // Stand-in for Gmail's own handlers: they record what reaches them, and a
      // click on an attachment opens "Gmail's preview" instead of the link.
      window.gmailEvents = [];
      for (const type of ['mousedown', 'mouseup', 'click', 'auxclick', 'keydown']) {
        document.addEventListener(type, (event) => {
          const target = event.target.closest('span.aZo, .dL');
          if (!target || (type === 'keydown' && event.key !== 'Enter')) return;
          const action = event.target.closest('[data-action]');
          window.gmailEvents.push(`${type}:${target.id}${action ? ':' + action.dataset.action : ''}`);
          if (type === 'click' || type === 'auxclick') event.preventDefault();
        });
      }
    </script>
  </body>
</html>
